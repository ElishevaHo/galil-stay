spring.application.name=galil-stay-server
server.port=8080

# מסד נתונים H2 שנשמר בקובץ
spring.datasource.url=jdbc:h2:file:./data/galilstay;DB_CLOSE_ON_EXIT=FALSE
spring.datasource.username=sa
spring.datasource.password=
spring.h2.console.enabled=true
spring.h2.console.path=/h2

spring.jpa.hibernate.ddl-auto=update
spring.jpa.open-in-view=false

# כתובת הלקוח (React) שמורשית לפנות לשרת
app.client-url=http://localhost:3000
